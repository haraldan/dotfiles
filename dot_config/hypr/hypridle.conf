# Omarchy's shell handles the screensaver and lock (see ~/.config/omarchy/shell.json).
# hypridle only suspends after 10 minutes idle, and only while on battery.
# Locking before sleep is handled by omarchy-sleep-lock.service.

listener {
    timeout = 600                                         # 10min.
    on-timeout = omarchy-power-present || systemctl suspend
}
