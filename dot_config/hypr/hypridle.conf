# Omarchy's shell handles the screensaver and lock (see ~/.config/omarchy/shell.json).
# On battery, hypridle also blanks the screen after 5 minutes and suspends after 10.
# Plugged in, the screen goes off with Omarchy's lock instead.
# Machines without a battery (omarchy-battery-present) behave as if plugged in.
# Locking before sleep is handled by omarchy-sleep-lock.service.

$on_ac = { omarchy-power-present || ! omarchy-battery-present; }

listener {
    timeout = 300                                         # 5min.
    # Same blank/wake commands Omarchy's lock screen uses
    on-timeout = $on_ac || { omarchy-brightness-keyboard off; omarchy-brightness-display off; }
    on-resume = omarchy-system-wake
}

listener {
    timeout = 600                                         # 10min.
    on-timeout = $on_ac || systemctl suspend
}
