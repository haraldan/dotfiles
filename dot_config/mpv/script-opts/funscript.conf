# Options for funscript.lua, read from script-opts/funscript.conf in mpv's
# config folder (~/.config/mpv, or $MPV_HOME).
# These are the defaults; list only what you change. Keys use input.conf names,
# several keys can be given separated by spaces, and an empty value unbinds it
# (script-binding funscript/<name> still works).

# Raise / lower maximum intensity
max_up=Ctrl+UP
max_down=Ctrl+DOWN
# Raise / lower minimum intensity
min_up=Ctrl+RIGHT
min_down=Ctrl+LEFT
# Shift timing earlier / later
offset_up=Ctrl+]
offset_down=Ctrl+[
# Switch between speed and position mode
mode=Ctrl+m
# Invert the range: high script values give the minimum intensity
invert=Ctrl+i
# Raise / lower contrast (1 = unchanged). » and « are what AltGr+] and AltGr+[
# type on the US international layout.
contrast_up=Alt+] »
contrast_down=Alt+[ «

# Intensity change per key press, in percent
intensity_step=10
# Timing change per key press, in milliseconds
offset_step=25
# Contrast change per key press
contrast_step=0.1
# Seconds of script, centered on the current moment, that contrast scales the
# movement around the average of
contrast_window=6
