## Use software volume only on the Savitech USB S/PDIF adapter.
## Its hardware PCM control has just 8 steps (~3 dB each), and changing it
## mid-playback glitches the audio. With the soft mixer, PipeWire leaves the
## hardware control untouched (keep it at 100%) and scales the stream itself.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-SAVIAUDIO_USB_SPDIF_TX_RX_Adapter.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
